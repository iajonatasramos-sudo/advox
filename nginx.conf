server {
    listen 80 default_server;
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de segurança — repetidos em cada location porque o nginx NÃO
    # herda add_header do server quando a location define o seu próprio.

    # SPA fallback — qualquer rota cai no index.html (Advox roteia no cliente)
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Não cacheia o index.html — pra mudanças aparecerem instantâneas
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        expires off;
    }

    # Assets imutáveis (Vite usa hash no nome dos chunks) — cache de 1 ano.
    # Asset inexistente devolve 404 de verdade (não o index.html), evitando
    # erro de MIME type confuso depois de um deploy.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
}
